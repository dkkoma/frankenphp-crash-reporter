name: Test

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *'
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          fmt_result="$(gofmt -l .)"
          if [ -n "${fmt_result}" ]; then
            echo "The following files need gofmt:" >&2
            echo "${fmt_result}" >&2
            exit 1
          fi

      - name: go vet
        run: |
          go vet ./...
          cd testhooks && go vet ./...

  frankenphp:
    name: FrankenPHP 1.x (${{ matrix.runner }}, ${{ matrix.optimization }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ ubuntu-latest, ubuntu-24.04-arm ]
        optimization: [ '-O0', '-O2' ]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Crash FrankenPHP and check the reports
        run: |
          set -o pipefail
          docker build --pull --progress plain --build-arg CGO_OPTIMIZATION=${{ matrix.optimization }} -t crash-reporter-test -f test/Dockerfile . 2>&1 | tee build.log

      - name: Crash FrankenPHP running as PID 1
        run: sh test/pid1.sh crash-reporter-test

      - name: Show the FrankenPHP version under test
        if: always()
        run: grep -m1 -o 'FrankenPHP v[^ ]* PHP [^ ]* Caddy v[^ ]*' build.log >> "$GITHUB_STEP_SUMMARY"
